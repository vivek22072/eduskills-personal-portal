name: Publish certificate portal

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download portal HTML
        run: |
          mkdir -p public
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J6J2y2QLEx1IkupMoNFbAGTGd9/4d7a03d9-0bcc-48a4-92e5-787827bce9f9.html' -o public/index.html
          test -s public/index.html
          grep -qi '<!doctype html' public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
